<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paid Creative CRM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-brand">
      <h1>PaidCreative</h1>
      <span class="subtitle">CRM</span>
    </div>
    <ul class="nav-links">
      <li><a href="#" class="nav-link active" data-view="pipeline">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Pipeline
      </a></li>
      <li><a href="#" class="nav-link" data-view="contacts">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Contacts
      </a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="rocket-tracker">
        <span class="mrr-label">Current MRR</span>
        <span class="mrr-value" id="sidebar-mrr">$0</span>
        <div class="rocket-bar-wrap">
          <div class="rocket-bar-goal">
            <span class="rocket-flag">&#127937;</span>
          </div>
          <div class="rocket-bar-track">
            <div class="rocket-stars">
              <span class="star" style="top:12%;left:20%">.</span>
              <span class="star" style="top:30%;left:70%">.</span>
              <span class="star" style="top:50%;left:35%">.</span>
              <span class="star" style="top:68%;left:60%">.</span>
              <span class="star" style="top:85%;left:25%">.</span>
            </div>
            <div class="rocket-bar-fill" id="rocket-bar-fill"></div>
            <div class="rocket-ship" id="rocket-ship">
              <span class="rocket-icon">&#128640;</span>
              <span class="rocket-flame">&#128293;</span>
            </div>
          </div>
          <div class="rocket-launchpad"></div>
        </div>
        <div class="rocket-goal-row" id="rocket-goal-row">
          <span class="rocket-goal-label">Goal:</span>
          <span class="rocket-goal-value" id="rocket-goal-value">$83,000</span>
          <input type="number" class="rocket-goal-input" id="rocket-goal-input" min="0" step="1000">
        </div>
        <div class="rocket-pct" id="rocket-pct">0%</div>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <!-- Pipeline View -->
    <section id="view-pipeline" class="view active">
      <div class="view-header">
        <h2>Sales Pipeline</h2>
        <div class="header-actions">
          <button class="btn btn-secondary" id="btn-add-contact-pipeline">+ New Contact</button>
          <button class="btn btn-primary" id="btn-add-deal">+ New Deal</button>
        </div>
      </div>
      <div class="pipeline-board" id="pipeline-board">
        <div class="pipeline-column" data-stage="discovery">
          <div class="column-header">
            <div class="column-header-top">
              <span class="stage-dot" style="background:#6366f1"></span>
              <h3>Discovery</h3>
              <span class="deal-count" data-count="discovery">0</span>
            </div>
            <div class="column-total" data-total="discovery">$0</div>
          </div>
          <div class="column-body" data-stage="discovery"></div>
        </div>
        <div class="pipeline-column" data-stage="qualification">
          <div class="column-header">
            <div class="column-header-top">
              <span class="stage-dot" style="background:#8b5cf6"></span>
              <h3>Qualification</h3>
              <span class="deal-count" data-count="qualification">0</span>
            </div>
            <div class="column-total" data-total="qualification">$0</div>
          </div>
          <div class="column-body" data-stage="qualification"></div>
        </div>
        <div class="pipeline-column" data-stage="proposal">
          <div class="column-header">
            <div class="column-header-top">
              <span class="stage-dot" style="background:#ec4899"></span>
              <h3>Proposal</h3>
              <span class="deal-count" data-count="proposal">0</span>
            </div>
            <div class="column-total" data-total="proposal">$0</div>
          </div>
          <div class="column-body" data-stage="proposal"></div>
        </div>
        <div class="pipeline-column" data-stage="negotiation">
          <div class="column-header">
            <div class="column-header-top">
              <span class="stage-dot" style="background:#f59e0b"></span>
              <h3>Negotiation</h3>
              <span class="deal-count" data-count="negotiation">0</span>
            </div>
            <div class="column-total" data-total="negotiation">$0</div>
          </div>
          <div class="column-body" data-stage="negotiation"></div>
        </div>
        <div class="pipeline-column" data-stage="closed_won">
          <div class="column-header">
            <div class="column-header-top">
              <span class="stage-dot" style="background:#10b981"></span>
              <h3>Closed Won</h3>
              <span class="deal-count" data-count="closed_won">0</span>
            </div>
            <div class="column-total" data-total="closed_won">$0</div>
          </div>
          <div class="column-body" data-stage="closed_won"></div>
        </div>
        <div class="pipeline-column" data-stage="closed_lost">
          <div class="column-header">
            <div class="column-header-top">
              <span class="stage-dot" style="background:#ef4444"></span>
              <h3>Lost/Inactive</h3>
              <span class="deal-count" data-count="closed_lost">0</span>
            </div>
            <div class="column-total" data-total="closed_lost">$0</div>
          </div>
          <div class="column-body" data-stage="closed_lost"></div>
        </div>
      </div>
    </section>

    <!-- Contacts View -->
    <section id="view-contacts" class="view">
      <div class="view-header">
        <h2>Contacts</h2>
        <div class="header-actions">
          <input type="text" class="search-input" id="contact-search" placeholder="Search contacts...">
          <button class="btn btn-primary" id="btn-add-contact">+ New Contact</button>
        </div>
      </div>
      <div class="contacts-layout">
        <div class="contacts-list" id="contacts-list"></div>
        <div class="contact-detail" id="contact-detail">
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            <p>Select a contact to view details</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Deal Modal -->
  <div class="modal-overlay" id="deal-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="deal-modal-title">New Deal</h3>
        <button class="modal-close" id="deal-modal-close">&times;</button>
      </div>
      <form id="deal-form">
        <input type="hidden" id="deal-id">
        <div class="form-group">
          <label for="deal-name">Deal Name *</label>
          <input type="text" id="deal-name" required placeholder="e.g. Acme Corp - Social Media Package">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="deal-value">Monthly Value ($) *</label>
            <input type="number" id="deal-value" required min="0" step="100" placeholder="5000">
          </div>
          <div class="form-group">
            <label for="deal-stage">Stage</label>
            <select id="deal-stage">
              <option value="discovery">Discovery</option>
              <option value="qualification">Qualification</option>
              <option value="proposal">Proposal</option>
              <option value="negotiation">Negotiation</option>
              <option value="closed_won">Closed Won</option>
              <option value="closed_lost">Closed Lost</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="deal-contact">Contact</label>
          <div class="deal-contact-picker">
            <select id="deal-contact">
              <option value="">-- Select Contact --</option>
            </select>
            <button type="button" class="btn btn-secondary btn-sm" id="deal-new-contact-toggle">+ New</button>
          </div>
          <div id="deal-new-contact-fields" class="deal-new-contact-fields" style="display:none">
            <div class="form-row">
              <div class="form-group">
                <label for="deal-contact-first">First Name *</label>
                <input type="text" id="deal-contact-first" placeholder="John">
              </div>
              <div class="form-group">
                <label for="deal-contact-last">Last Name *</label>
                <input type="text" id="deal-contact-last" placeholder="Doe">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="deal-contact-email">Email</label>
                <input type="email" id="deal-contact-email" placeholder="john@acme.com">
              </div>
              <div class="form-group">
                <label for="deal-contact-company">Company</label>
                <input type="text" id="deal-contact-company" placeholder="Acme Corp">
              </div>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="deal-notes">Notes</label>
          <textarea id="deal-notes" rows="3" placeholder="Add deal notes..."></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="deal-cancel">Cancel</button>
          <button type="button" class="btn btn-danger" id="deal-delete" style="display:none">Delete</button>
          <button type="submit" class="btn btn-primary">Save Deal</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Contact Modal -->
  <div class="modal-overlay" id="contact-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="contact-modal-title">New Contact</h3>
        <button class="modal-close" id="contact-modal-close">&times;</button>
      </div>
      <form id="contact-form">
        <input type="hidden" id="contact-id">
        <div class="form-row">
          <div class="form-group">
            <label for="contact-first">First Name *</label>
            <input type="text" id="contact-first" required placeholder="John">
          </div>
          <div class="form-group">
            <label for="contact-last">Last Name *</label>
            <input type="text" id="contact-last" required placeholder="Doe">
          </div>
        </div>
        <div class="form-group">
          <label for="contact-company">Company</label>
          <input type="text" id="contact-company" placeholder="Acme Corp">
        </div>
        <div class="form-group">
          <label for="contact-email">Email</label>
          <input type="email" id="contact-email" placeholder="john@acmecorp.com">
        </div>
        <div class="form-group">
          <label for="contact-phone">Phone</label>
          <input type="text" id="contact-phone" placeholder="(555) 123-4567">
        </div>
        <div class="form-group">
          <label for="contact-title">Job Title</label>
          <input type="text" id="contact-title" placeholder="Marketing Director">
        </div>
        <div class="form-group">
          <label for="contact-notes">Notes</label>
          <textarea id="contact-notes" rows="3" placeholder="Add notes about this contact..."></textarea>
        </div>
        <div class="form-group" id="contact-deals-section" style="display:none">
          <label>Pipeline Deals</label>
          <div id="contact-deals-stages"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="contact-cancel">Cancel</button>
          <button type="button" class="btn btn-danger" id="contact-delete" style="display:none">Delete</button>
          <button type="submit" class="btn btn-primary">Save Contact</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
